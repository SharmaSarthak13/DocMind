spring.application.name=documentapi

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}

# Local storage for uploaded documents
app.storage.location=${STORAGE_LOCATION:uploads}

# Initial upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

